name: Build ZapretDroid APK

on:
  workflow_dispatch:
  push:
    branches: ["zapret"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout ZapretDroid
        uses: actions/checkout@v4
        with:
          repository: ezxidze/ZapretDroid
          ref: 68e90ec7857a37e7777e33d19660539b1cb39822
          path: zapretdroid

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build ZapretDroid debug APK
        working-directory: zapretdroid
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zapretdroid-debug-apk
          path: zapretdroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
